<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tuiter - Log in</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="dist/css/styles.css" />
    <script src="https://kit.fontawesome.com/43c9e5e89e.js" crossorigin="anonymous"></script>
    <script type="module" src="src/js/index.mjs"></script>
  </head>

  <body class="min-vh-100 d-flex flex-column">
    <header>
      <nav class="bg-dark d-flex justify-content-center">
        <img src="images/logo.png" alt="Logo" class="mt-2" />
      </nav>
    </header>

    <main class="vh-100 align-items-center bg-dark">
      <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100 gap-1">
          <div class="col-xl-10">
            <div class="row">
              <div class="col-lg-6 bg-secondary rounded gap">
                <div class="card-body p-3 mx-md-4">
                  <div class="text-center">
                    <img src="images/logo.png" alt="Logo" class="p-1" />
                    <h4 class="mt-1 mb-5 pb-1">Login</h4>
                  </div>

                  <h1 class="h2 text-center">Already have an account?</h1>

                  <div class="text-center pt-1 mb-5 pb-1 d-flex flex-column">
                    <a class="btn btn-primary btn-block mb-3 mt-3" href="profile/login/">
                      Log in here!
                    </a>
                    <a class="text-muted" href="#!">Forgot password?</a>
                  </div>
                </div>
              </div>
              <div class="col-lg-6 text-white text-center p-4 rounded bg-primary">
                <h1 class="p-1 text-center">Join Tuiter today</h1>
                <p class="fw-bold">
                  Create a new account to get access to Tuiter and Post with
                  your friends
                </p>
                <a href="profile/register/" class="btn btn-secondary">
                  Create account
                </a>
                <img src="images/shyam-mishra-0WjJZMyc-XU-unsplash.jpg" alt="Image-displaying-social-media-app"
                  class="image-login mt-4" />
                <h4 class="mt-1 mb-1 pb-1 text-white">Get the app</h4>
                <div class="d-flex justify-content-evenly mt-2">
                  <a class="link-secondary fw-bold" href="#!">Play store</a>
                  <a class="link-secondary fw-bold" href="#!">Apple store</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>

</html>
